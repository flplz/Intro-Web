<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Devs</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div>
        <h1 id = "titulo">Cadastro de DEVs</h1>
        <p id = "subtitulo">Complete suas informações</p>
        <br>
    </div>
    <form>
        <fieldset class="grupo">
            <div class="campo">
                <label><strong>Nome:</strong></label>
                <input type="text" name="nome" required>
            </div>

            <div class="campo">
                <label><strong>Sobrenome:</strong></label>
                <input type="text" name="sobrenome" required>
            </div>
        </fieldset>
        <br>
        <div class="campo">
            <label>Email:</label>
            <input type="email" name="email" required>
        </div>
        <div class="campo">
            <label><strong>De qual lado da aplicação você desenvolve:</strong></label>
            <label>
                <input type="radio" name="devweb" value="frontend" checked> Front-end
            </label>
            <label>
                <input type="radio" name="devweb" value="backend"> Back-end
            </label>
            <label>
                <input type="radio" name="devweb" value="fullstack"> Fullstack
            </label>
        </div>
        <div class="campo">
            <label><strong>Senioridade:</strong></label>
            <select required>
                <option value="" selected disabled>Selecione</option>
                <option value="junior">Júnior</option>
                <option value="pleno">Pleno</option>
                <option value="senior">Sênior</option>
            </select>
        </div>
        <fieldset class="grupo">
            <div class="check">
                <label><strong>Selecione as tecnologias que utiliza:</strong></label>
                <label>
                <input type="checkbox" name="tecnologia1" value="HTML">HTML</label>
                <label>
                <input type="checkbox" name="tecnologia2" value="CSS">CSS</label>
                <label>
                <input type="checkbox" name="tecnologia3" value="JS">JavaScript</label>
                <label>
                <input type="checkbox" name="tecnologia4" value="PHP">PHP</label>
                <label>
                <input type="checkbox" name="tecnologia5" value="C#">C#</label>
                <label>
                <input type="checkbox" name="tecnologia6" value="PYTHON">PYTHON</label>
                <label>
                <input type="checkbox" name="tecnologia7" value="JAVA">JAVA</label>
                
            </div>
            <div class="campo">
                <label><strong>Conte um pouco mais da sua experiência:</strong></label>
                <br>
                <textarea name="experiencia" rows="5" style="width: 26em"></textarea>
            </div>
            <button class=" botao" type="submit">Concluido</button>

        </fieldset>

    </form>
    
</body>
</html>
